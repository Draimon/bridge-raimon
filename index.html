<style>
  :root {
    --bg: #f3f1ea; --card: #ffffff; --ink: #1d2320; --muted: #66706b; --line: #dcd8cc;
    --accent: #1f6b45; --accent-ink: #ffffff; --accent-soft: #e2efe7;
    --red: #c4262e; --ok: #1f7a46; --ok-soft: #dff1e5; --ko: #b3261e; --ko-soft: #f9e0de;
    --hl: #fff2c2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141816; --card: #1e2421; --ink: #e8ece9; --muted: #9aa49f; --line: #333b37;
      --accent: #3fa36f; --accent-ink: #0d1410; --accent-soft: #23362b;
      --red: #ff6b6b; --ok: #5cc98a; --ok-soft: #1e3828; --ko: #ff7b72; --ko-soft: #3d2220;
      --hl: #4a4220;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .fiche { scroll-margin-top: 64px; }
  header.top { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: -16px -16px 8px; padding: 6px 16px; position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tobtn { border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 999px; padding: 6px 12px; font-size: 15px; cursor: pointer; }
  .sheet { position: fixed; inset: 0; z-index: 100; background: var(--bg); color: var(--ink); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
  .sheet header.top { margin: 0 -16px 8px; padding-top: calc(6px + env(safe-area-inset-top)); }
  .sheet .inner { max-width: 560px; margin: 0 auto; }
  body.tablemode .sheet header.top, .sheet header.top { background: var(--bg); border-bottom-color: var(--line); }
  body.tablemode .sheet header.top h1 { color: var(--ink); }
  .sheet .toc { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  .sheet .toc .pill { flex: none; }
  body.tablemode .tobtn.sys { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.3); }
  header.top h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 8px 4px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .btn {
    display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 12px; padding: 14px 16px; font-size: 17px; margin-bottom: 10px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .btn.primary small { color: var(--accent-ink); opacity: .85; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2 .btn { margin-bottom: 0; }
  .hero { text-align: center; padding: 8px 0 16px; }
  .hero .logo { font-size: 40px; letter-spacing: 4px; }
  .hero h1 { margin: 4px 0 0; font-size: 28px; color: var(--accent); }
  .hero p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .stats { display: flex; justify-content: space-around; text-align: center; }
  .stats b { display: block; font-size: 22px; }
  .stats span { color: var(--muted); font-size: 13px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; }
  .red { color: var(--red); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  /* Question */
  .qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .qnum { font-weight: 700; font-size: 18px; }
  .qtheme { color: var(--muted); font-size: 14px; text-align: right; }
  .progress { color: var(--muted); font-size: 14px; }
  table.auction { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 4px 0 12px; }
  table.auction th { font-size: 13px; color: var(--muted); font-weight: 600; padding: 4px 0; border-bottom: 1px solid var(--line); }
  table.auction th.me { color: var(--accent); }
  table.auction td { text-align: center; padding: 6px 0; font-size: 18px; font-weight: 600; }
  table.auction td.hl span { background: var(--hl); border-radius: 6px; padding: 2px 8px; }
  table.auction td.ask { color: var(--accent); font-size: 22px; }
  .vul { font-size: 13px; color: var(--muted); }
  .hand { font-size: 20px; font-weight: 600; letter-spacing: .02em; margin: 6px 0 12px; }
  .hand div { padding: 2px 0; }
  .hand .s { display: inline-block; width: 26px; }
  .hand .meta { font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  .prompt { font-size: 18px; font-weight: 600; margin: 4px 0 12px; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 13px 14px; font-size: 16px; margin-bottom: 8px; cursor: pointer; }
  .opt.good { border-color: var(--ok); background: var(--ok-soft); }
  .opt.bad { border-color: var(--ko); background: var(--ko-soft); }
  .opt:disabled { cursor: default; color: var(--ink); }
  /* Boîte d'enchères */
  .box { margin-top: 4px; }
  .levels, .strains, .specials { display: grid; gap: 6px; margin-bottom: 8px; }
  .levels { grid-template-columns: repeat(7, 1fr); }
  .strains { grid-template-columns: repeat(5, 1fr); }
  .specials { grid-template-columns: 2fr 1fr 1fr; }
  .bb { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 12px 0;
    font-size: 19px; font-weight: 700; cursor: pointer; }
  .bb.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .bb.sel .red { color: inherit; }
  .bb:disabled { opacity: .3; cursor: default; }
  .bb.pass { background: var(--ok-soft); }
  .bb.dbl { background: var(--ko-soft); }
  .chosen { text-align: center; font-size: 15px; color: var(--muted); min-height: 24px; margin-bottom: 8px; }
  .chosen b { color: var(--ink); font-size: 20px; }
  .feedback { border-radius: 12px; padding: 14px; margin-top: 4px; }
  .feedback.ok { background: var(--ok-soft); }
  .feedback.ko { background: var(--ko-soft); }
  .feedback h3 { margin: 0 0 6px; font-size: 18px; }
  .feedback p { margin: 6px 0; }
  .fiche-line { font-size: 14px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; margin-top: 10px; }
  .link { background: none; border: 0; color: var(--accent); padding: 8px 0 0; font-size: 15px; cursor: pointer; text-decoration: underline; }
  /* Fiche */
  .fiche h2 { font-size: 18px; color: var(--accent); margin: 0 0 8px; }
  .fiche ul { margin: 0; padding-left: 18px; }
  .fiche li { margin: 4px 0; }
  .toc { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .toc a { font-size: 14px; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); text-decoration: none; }
  .dgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 10px; }
  .dcell { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 12px 0; font-size: 17px; font-weight: 700; cursor: pointer; }
  .dcell.good { background: var(--ok-soft); border-color: var(--ok); }
  .dcell.bad { background: var(--ko-soft); border-color: var(--ko); }
  table.auction td.wasbad span { text-decoration: underline wavy var(--ko); text-underline-offset: 4px; }
  .compass { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "n n" "o e" "s s"; gap: 10px; margin-top: 10px; }
  .cN { grid-area: n; justify-self: center; } .cO { grid-area: o; } .cE { grid-area: e; justify-self: end; } .cS { grid-area: s; justify-self: center; }
  .mini { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .msgs { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .msg { align-self: flex-start; max-width: 85%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px 12px 12px 3px; padding: 6px 10px; font-size: 15px; }
  .msg.me { align-self: flex-end; background: var(--ok-soft); border-radius: 12px 12px 3px 12px; }
  .msg small { display: block; font-size: 11px; color: var(--muted); }
  .talkbox { width: 100%; margin-top: 8px; font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); box-sizing: border-box; }
  .mini .who { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .cS .mini .who { color: var(--accent); }
  ol.expl { margin: 8px 0 0; padding-left: 22px; font-size: 15px; }
  ol.expl li { margin: 6px 0; }
  ol.expl li.bad { background: var(--ko-soft); border-radius: 6px; padding: 2px 6px; }
  .playbar { padding: 10px 14px; font-size: 15px; }
  .card.hand { padding: 10px 12px; }
  .card.hand.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .hl { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .card.hand.active .hl { color: var(--accent); font-weight: 700; }
  .hrow { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-height: 40px; }
  .hs { width: 20px; font-size: 18px; }
  .cd { min-width: 34px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font-size: 17px; font-weight: 700; cursor: pointer; padding: 0 6px; }
  .cd.red { color: var(--red); }
  .cd:not(:disabled) { border-color: var(--accent); box-shadow: 0 1px 0 var(--accent); }
  .cd:disabled { opacity: .45; cursor: default; }
  .table3 { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-areas: ". n ." "o . e" ". s ."; gap: 2px; margin: 0 0 12px; }
  .tc { text-align: center; } .tN { grid-area: n; } .tO { grid-area: o; } .tE { grid-area: e; } .tS { grid-area: s; }
  .tn { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .tc.turn .tn { color: var(--accent); font-weight: 700; }
  .pc { display: inline-block; min-width: 52px; padding: 8px 6px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-size: 18px; font-weight: 700; }
  .pc.empty { background: transparent; border-style: dashed; height: 40px; }
  .pc.win { border-color: var(--accent); background: var(--accent-soft); }
  #majbar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 50; max-width: 536px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #majbar button { border: 0; border-radius: 10px; padding: 8px 12px; font-size: 15px; font-weight: 700; background: var(--accent-ink); color: var(--accent); cursor: pointer; }
  .pill { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  .pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .pill.on .red { color: inherit; }
  #chapter { scroll-margin-top: 64px; }
  /* ── Tapis et cartes (couleurs fixes : un vrai tapis ne change pas en mode sombre) */
  .felt { background: radial-gradient(ellipse at center, #2f8a57 0%, #1f6340 75%); border-radius: 18px; padding: 10px; color: #fff; margin: 4px 0 12px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), 0 2px 6px rgba(0,0,0,.2); }
  .felt .sname { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; opacity: .85; }
  .felt .turn .sname, .felt .sname.turn { color: #ffe08a; opacity: 1; font-weight: 800; }
  .feltnote { text-align: center; opacity: .8; margin: 18px 0; font-size: 14px; }
  .felt.bidding { display: grid; grid-template-columns: 1fr 1.2fr 1fr; grid-template-areas: ". top ." "left center right" ". bottom ."; gap: 8px; min-height: 210px; align-items: center; }
  .bzone { text-align: center; } .bzone.top { grid-area: top; } .bzone.left { grid-area: left; } .bzone.right { grid-area: right; } .bzone.bottom { grid-area: bottom; }
  .bcenter { grid-area: center; text-align: center; font-size: 12px; opacity: .8; border: 1px dashed rgba(255,255,255,.35); border-radius: 10px; padding: 8px 4px; }
  .bids { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 4px; }
  .bzone.left .bids, .bzone.right .bids { flex-direction: column; align-items: center; }
  .bidcard { min-width: 40px; height: 28px; padding: 0 6px; border-radius: 5px; background: #fff; color: #1d2320; font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .bidcard .red { color: #c4262e; }
  .bidcard.pass { background: #43a866; color: #fff; font-size: 13px; } .bidcard.dbl { background: #d9443b; color: #fff; } .bidcard.rdbl { background: #2f6fd1; color: #fff; }
  .bidcard.last { outline: 2px solid #ffe08a; outline-offset: 1px; } .bidcard.wasbad { outline: 2px dashed #ff8a80; outline-offset: 1px; }
  .bidcard.ask { background: transparent; color: #ffe08a; border: 2px dashed #ffe08a; box-shadow: none; }
  .pcard { width: 44px; height: 64px; border-radius: 6px; background: #fff; border: 1px solid #c8c8c8; box-shadow: 0 1px 3px rgba(0,0,0,.35); position: relative; color: #1d2320; flex: 0 0 auto; transition: transform .12s; }
  .pcard .rk { position: absolute; top: 2px; left: 4px; font-weight: 800; font-size: 16px; line-height: 1; letter-spacing: -1px; }
  .pcard .st { position: absolute; top: 19px; left: 4px; font-size: 15px; line-height: 1; }
  .pcard .big { position: absolute; right: 4px; bottom: 3px; font-size: 24px; line-height: 1; }
  .pcard.red { color: #c4262e; }
  .pcard.back { background: repeating-linear-gradient(45deg, #b8322e 0 4px, #cf4a45 4px 8px); border: 2px solid #fff; }
  .pcard.play { cursor: pointer; transform: translateY(-8px); box-shadow: 0 5px 10px rgba(0,0,0,.35); }
  .pcard.dim { filter: brightness(.8) saturate(.8); }
  .pcard.win { outline: 3px solid #ffe08a; }
  .fan { display: flex; justify-content: center; padding: 12px 0 6px; }
  .fan .pcard + .pcard { margin-left: -20px; }
  .dummy { display: flex; justify-content: center; gap: 6px; margin: 6px 0 4px; min-height: 64px; }
  .dcol { display: flex; flex-direction: column; align-items: center; }
  .dcol .pcard + .pcard { margin-top: -44px; }
  .dcol .pcard.play { transform: translateX(0) translateY(0); box-shadow: 0 0 0 2px #ffe08a; }
  .midrow { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; margin: 6px 0; }
  .side { text-align: center; font-size: 12px; } .side .backs { display: flex; justify-content: center; margin: 4px 0; } .side .backs .pcard { width: 26px; height: 38px; } .side .backs .pcard + .pcard { margin-left: -16px; } .side .cnt { opacity: .8; }
  .trick { position: relative; width: 150px; height: 170px; margin: 0 auto; }
  .trick .slot { position: absolute; } .slot.top { left: 53px; top: 0; } .slot.bottom { left: 53px; bottom: 0; } .slot.left { left: 0; top: 53px; } .slot.right { right: 0; top: 53px; }
  .playbar { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 15px; margin-bottom: 6px; }
  .playbar .score { display: flex; gap: 12px; } .playbar .score b { font-size: 18px; }
  .bb { background: #fff; color: #1d2320; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .bb .red { color: #c4262e; }
  .bb.pass { background: #43a866; color: #fff; border-color: #43a866; } .bb.dbl { background: #d9443b; color: #fff; border-color: #d9443b; } .bb.rdbl { background: #2f6fd1; color: #fff; border-color: #2f6fd1; }
  /* ── Mode table (façon Funbridge) */
  body.tablemode { background: radial-gradient(ellipse at 50% 40%, #2a7a4c 0%, #1b5535 80%); }
  body.tablemode header.top { background: transparent; border-bottom-color: rgba(255,255,255,.15); }
  body.tablemode header.top h1, body.tablemode .back { color: #fff; }
  body.tablemode .feltnote, body.tablemode .gridhint { color: #e8f5ec; }
  .frame { position: relative; border: 2px solid #d8962b; border-radius: 4px; margin: 26px 34px 14px; min-height: 230px; padding: 30px 6px; }
  .plate { position: absolute; background: #1d2724; color: #fff; font-size: 13px; font-weight: 600; border-radius: 6px; padding: 4px 10px 4px 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; z-index: 2; }
  .plate .seat { background: #b8322e; color: #fff; font-weight: 800; padding: 4px 8px; border-radius: 6px 0 0 6px; }
  .plate.turn { background: #e08a1e; } .plate.turn .seat { background: #a3561a; }
  .plate.top { top: -15px; left: 50%; transform: translateX(-50%); }
  .plate.bottom { bottom: -15px; left: 50%; transform: translateX(-50%); }
  .plate.left { left: -30px; top: 50%; transform: translateY(-50%) rotate(-90deg); transform-origin: center; }
  .plate.right { right: -30px; top: 50%; transform: translateY(-50%) rotate(90deg); transform-origin: center; }
  .frame:not(.bidframe) .plate.left { left: -62px; } .frame:not(.bidframe) .plate.right { right: -62px; }
  .plate .contract { background: #f6d5d5; color: #b8322e; border-radius: 4px; padding: 0 6px; margin-left: 2px; font-weight: 800; }
  .plate .contract .red { color: #b8322e; }
  .corner { position: absolute; color: #e2a94a; font-size: 13px; line-height: 1.1; } .corner b { font-size: 18px; }
  .corner.cl { left: 6px; bottom: 18px; } .corner.cr { right: 6px; bottom: 18px; text-align: right; }
  .frame .trick { width: 170px; height: 190px; }
  .frame .trick .slot.top { left: 60px; top: 0; } .frame .trick .slot.bottom { left: 60px; bottom: 0; } .frame .trick .slot.left { left: 0; top: 57px; } .frame .trick .slot.right { right: 0; top: 57px; }
  .pcard.md { width: 50px; height: 72px; } .pcard.md .rk { font-size: 18px; } .pcard.md .st { top: 21px; font-size: 16px; } .pcard.md .big { font-size: 28px; }
  .pcard.lg { width: 66px; height: 96px; border-radius: 8px; } .pcard.lg .rk { font-size: 24px; top: 4px; left: 6px; } .pcard.lg .st { top: 30px; left: 7px; font-size: 20px; } .pcard.lg .big { font-size: 38px; right: 6px; bottom: 6px; }
  .dummy { margin: 4px 0 0; } .dcol .pcard.md + .pcard.md { margin-top: -50px; } .dcol .pcard.play { box-shadow: 0 0 0 3px #ffe08a; transform: none; }
  .arc { position: relative; height: 150px; margin: 6px auto 4px; max-width: 390px; overflow: visible; }
  .arc .pcard.lg { position: absolute; left: calc(50% - 33px); top: 34px; transform-origin: 50% 560px; }
  .arc .pcard.play { box-shadow: 0 0 0 3px #ffe08a, 0 6px 12px rgba(0,0,0,.4); }
  .bidframe { min-height: 0; padding: 26px 44px 28px; margin: 26px 12px 14px; }
  .bidframe .plate.left { left: -22px; } .bidframe .plate.right { right: -22px; }
  .chips { position: absolute; display: flex; gap: 3px; z-index: 1; }
  .chips.top { top: 17px; left: 50%; transform: translateX(-50%); } .chips.bottom { bottom: 20px; left: 50%; transform: translateX(-50%); }
  .chips.left { left: 28px; top: 50%; transform: translateY(-50%); flex-direction: column; } .chips.right { right: 28px; top: 50%; transform: translateY(-50%); flex-direction: column; }
  .chips .bidcard { min-width: 26px; height: 22px; font-size: 12px; padding: 0 3px; }
  .bidcenter { margin: 18px 0; }
  .vulnote { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #e2a94a; font-size: 12px; pointer-events: none; }
  .bidframe:has(.chips.bottom .bidcard) .vulnote { display: none; }
  .gridbox { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }

  .gb span { font-size: 15px; } .gb:disabled { visibility: hidden; }
  .gb.g0 { background: #cfe6fb; color: #123d8a; } .gb.g1 { background: #c2c8d0; color: #1d2320; } .gb.g2 { background: #f9d0d0; color: #b51f1f; }
  .gb.g3 { background: #fbd9b0; color: #c26a00; } .gb.g4 { background: #e3e6ea; color: #3b4450; }
  .gb .red { color: inherit; }
  .gb.sel { outline: 3px solid #ffe08a; outline-offset: 1px; transform: scale(1.06); }
  .gspecial { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6px; margin-top: 8px; }
  .gb.gpass { background: #23a24d; color: #fff; font-size: 20px; } .gb.gx { background: #d9332b; color: #fff; } .gb.gxx { background: #2f6fd1; color: #fff; }
  .gspecial .gb:disabled { visibility: visible; opacity: .3; }
  .announce { margin-top: 10px; }
  .gridhint { text-align: center; font-size: 14px; margin: 10px 0 0; }
  body.tablemode .feedback h3 { color: var(--ink); }
  .solnav { display: grid; grid-template-columns: 1fr 1fr 1fr 1.6fr; gap: 6px; margin-bottom: 4px; } .solnav .btn { margin: 0; padding: 10px 0; font-size: 18px; }
  .solinfo { color: #e8f5ec; font-size: 14px; margin: 4px 0 10px; }
  .openhands { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 -8px; }
  .ohand { background: rgba(0,0,0,.22); border-radius: 10px; padding: 6px 8px; color: #fff; font-size: 13px; font-weight: 600; line-height: 1.35; }
  .ohand .sname { font-size: 11px; text-transform: uppercase; opacity: .8; }
  .ohand .red { color: #ff8a80; }
  /* Tablette / ordinateur : la table grandit proportionnellement */
  @media (min-width: 700px) and (min-height: 800px) { body.tablemode .wrap { zoom: 1.3; } }
  @media (min-width: 1000px) and (min-height: 900px) { body.tablemode .wrap { zoom: 1.5; } }
  /* Boîte d'enchères plus étroite : les enchères adverses restent visibles sur les côtés */
  .bidcenter { margin: 18px 22px; }
  .gridwrap { position: relative; }
  .gb { height: 36px; font-size: 18px; } .gb span { font-size: 13px; }
  .gspecial .gb { height: 38px; }
  .bigbid-veil { position: absolute; inset: -6px; background: rgba(10, 40, 25, .55); border-radius: 10px; z-index: 7; }
  .gb.bigbid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8; width: 150px; height: 110px; font-size: 46px; flex-direction: column; gap: 4px; border: 3px solid #ffe08a; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .gb.bigbid span { font-size: 30px; } .gb.bigbid.gpass { font-size: 30px; }
  .gb.bigbid small { font-size: 11px; font-weight: 600; opacity: .8; }
  .gb.bigbid span { display: inline; } .gb.bigbid > span { margin-left: 2px; }
  .chips .bidcard { min-width: 30px; height: 20px; font-size: 11px; }
  /* Boutons principaux sur le tapis : jaune, bien visibles */
  body.tablemode .btn.primary { background: #ffd54f; color: #1d2320; border-color: #ffd54f; }
  body.tablemode .btn.primary:disabled { background: #7a8a7f; border-color: #7a8a7f; }
  /* Dernière enchère de chaque joueur, hors du cadre (façon Funbridge) */
  .bidframe { margin: 64px 42px 60px; padding: 26px 24px 30px; }
  .bidframe .plate.left { left: -40px; } .bidframe .plate.right { right: -40px; }
  .bidframe .bidcenter { margin: 10px 0; }
  .bidstack { position: absolute; display: flex; gap: 4px; z-index: 3; }
  .bidstack.N { top: -56px; left: -34px; } .bidstack.S { bottom: -56px; left: -34px; }
  .bidstack.E { top: -16px; right: -46px; flex-direction: column; } .bidstack.O { bottom: -14px; left: -46px; flex-direction: column; }
  .gb.stack { width: 40px; height: 36px; font-size: 17px; cursor: default; } .gb.stack span { font-size: 13px; }
  .gb.stack.gpass { font-size: 9px; } .gb.stack.stop { background: #d9332b; color: #fff; font-size: 10px; }
  .gb.stack.last { outline: 3px solid #ffe08a; outline-offset: 1px; } .gb.stack.wasbad { outline: 3px dashed #ff8a80; outline-offset: 1px; }
  .gb.lastbid { position: absolute; width: 50px; height: 44px; font-size: 20px; cursor: default; z-index: 3; }
  .gb.lastbid span { font-size: 15px; }
  .gb.lastbid.gpass { font-size: 10px; width: 54px; }
  .gb.lastbid.N { top: -60px; left: -34px; } .gb.lastbid.E { top: -60px; right: -34px; }
  .gb.lastbid.O { left: -46px; bottom: 26px; } .gb.lastbid.S { bottom: -60px; left: -34px; }
  .gb.lastbid.last { outline: 3px solid #ffe08a; outline-offset: 1px; }
  .gb.lastbid.wasbad { outline: 3px dashed #ff8a80; outline-offset: 1px; }
  .vulnote { bottom: 16px; }
  .bidframe .gridhint { margin-bottom: 14px; }
  .auctionline { text-align: left; color: #e8f5ec; font-size: 13px; margin: -50px 12px 18px 78px; min-height: 36px; opacity: .85; }
  .auctionline .red { color: #ff9c94; }
  .pcard.can { cursor: pointer; }
  .pcard.sel { box-shadow: 0 0 0 3px #ffe08a, 0 8px 14px rgba(0,0,0,.45); }
  .pcard.off { filter: brightness(.88); }
  .arc .pcard.play, .dcol .pcard.play { box-shadow: none; }
  .dcol .pcard.sel { box-shadow: 0 0 0 3px #ffe08a, 0 8px 16px rgba(0,0,0,.5); }
  .dummywrap { position: relative; }
  .dcol.ghost { opacity: .3; }
  .dpick { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 6; display: flex; justify-content: center; gap: 6px; }
  .dpick .pcard { transform: scale(1.12); box-shadow: 0 0 0 3px #ffe08a, 0 8px 16px rgba(0,0,0,.5); }
  .dpick.tight { gap: 0; } .dpick.tight .pcard + .pcard { margin-left: -8px; }
  .handwrap { position: relative; }
  .hpick { position: absolute; left: 0; right: 0; bottom: calc(100% - 26px); z-index: 6; display: flex; justify-content: center; gap: 6px; }
  .hpick .pcard { transform: scale(1.12); box-shadow: 0 0 0 3px #ffe08a, 0 8px 16px rgba(0,0,0,.5); }
  .hpick.tight { gap: 0; } .hpick.tight .pcard + .pcard { margin-left: -8px; }
  .pcard.ghost { opacity: .3; }
  .btn.who { font-size: 22px; padding: 18px; }
  .claimgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .hint { border-color: var(--accent); background: var(--accent-soft); padding: 12px 16px; }
  .hint summary { font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  .hint summary::-webkit-details-marker { display: none; }
  .hint summary::after { content: "▸"; color: var(--accent); transition: transform .2s; }
  .hint[open] summary::after { transform: rotate(90deg); }
  .shareico { display: inline-block; border: 1.5px solid currentColor; border-radius: 4px; padding: 0 4px; font-size: 13px; color: #0a7aff; }
  .mode { display: flex; align-items: center; gap: 14px; padding: 18px 16px; font-size: 20px; }
  .mode-ico { font-size: 30px; width: 36px; text-align: center; }
  details.card summary { cursor: pointer; }
  input.num { width: 100%; font-size: 20px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); margin-bottom: 10px; }

  .missed { display: flex; flex-wrap: wrap; gap: 6px; }

</style>

<body>
<div class="wrap" id="app"></div>
<script src="questions.js?v=202610130144"></script>
<script src="fiche.js?v=202610130144"></script>
<script src="deals.js?v=202610130144"></script>
<script src="deals-duo.js?v=202610130144"></script>
<script src="dds.js?v=202610130144"></script>
<script src="jeu.js?v=202610130144"></script>
<script src="adeux.js?v=202610130144"></script>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const SEATS = ['O', 'N', 'E', 'S'];             // colonnes du tableau, dans l'ordre du jeu
  const SEAT_NAMES = { O: 'Ouest', N: 'Nord', E: 'Est', S: 'Sud' };
  const STRAINS = ['♣', '♦', '♥', '♠', 'SA'];
  const THEME_NAME = Object.fromEntries(THEMES);
  const BY_N = new Map(QUESTIONS.map(q => [q.n, q]));
  const STORE_KEY = 'raimon-quiz-v1';

  // ───── Joueur (sans mot de passe : on choisit qui on est) et sa progression, gardée sur l'appareil
  const PLAYERS = ['Michèle', 'Damien', 'Hélène'];
  let player = null;
  try { player = localStorage.getItem('raimon-player'); } catch (e) { player = null; }
  if (!PLAYERS.includes(player)) player = null;
  const keyFor = p => STORE_KEY + ':' + p;
  let progress = {};
  function loadProgress() {
    try {
      // Première fois : la progression d'avant (sans joueur) revient au premier joueur choisi sur cet appareil.
      const old = localStorage.getItem(STORE_KEY);
      if (old && !localStorage.getItem(keyFor(player))) { localStorage.setItem(keyFor(player), old); localStorage.removeItem(STORE_KEY); }
      progress = JSON.parse(localStorage.getItem(keyFor(player))) || {};
    } catch (e) { progress = {}; }
  }
  function save() { if (!player) return; try { localStorage.setItem(keyFor(player), JSON.stringify(progress)); } catch (e) { /* stockage indisponible */ } }
  function whoAmI() {
    document.body.classList.remove('tablemode');
    app.innerHTML = `
      <div class="hero"><div class="logo">♠<span class="red">♥</span><span class="red">♦</span>♣</div>
        <h1>Système Raimon</h1><p>Qui es-tu ?</p></div>
      ${PLAYERS.map(p => `<button class="btn primary center who" data-who="${p}">${p}</button>`).join('')}
      <p class="center muted" style="font-size:13px">Chacun garde sa propre progression (quiz et donnes).</p>`;
    app.querySelectorAll('[data-who]').forEach(b => b.addEventListener('click', () => {
      player = b.dataset.who;
      try { localStorage.setItem('raimon-player', player); } catch (e) { /* stockage indisponible */ }
      loadProgress(); go(home);
    }));
  }
  function record(n, ok) {
    const p = progress[n] || { ok: 0, ko: 0, streak: 0 };
    if (ok) { p.ok++; p.streak = (p.streak || 0) + 1; } else { p.ko++; p.streak = 0; }
    p.last = ok ? 1 : 0;
    progress[n] = p; save();
  }
  // « À revoir » : ratée la dernière fois, ou ratée un jour et pas encore réussie 2 fois de suite.
  const toReview = () => QUESTIONS.filter(q => { const p = progress[q.n]; return p && (p.last === 0 || (p.ko > 0 && p.streak < 2)); });
  const mastered = q => { const p = progress[q.n]; return p && p.last === 1 && (p.ko === 0 || p.streak >= 2); };

  // ───── Outils
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const suits = html => html.replace(/[♥♦]/g, m => `<span class="red">${m}</span>`);
  const fmt = s => suits(esc(s));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const bidLabel = b => b === 'P' ? 'Passe' : b;
  const bidRank = b => { const m = /^([1-7])(♣|♦|♥|♠|SA)$/.exec(b); return m ? (m[1] - 1) * 5 + STRAINS.indexOf(m[2]) : -1; };
  const bids = q => (q.s || '').split(/\s+/).filter(Boolean);
  const bidderOf = q => SEATS[(SEATS.indexOf(q.d) + bids(q).length - 1) % 4];

  // Mélange : une question par thème, sans jamais répéter un thème tant que tous n'ont pas été vus.
  function mix(count) {
    const out = [];
    while (out.length < count) {
      for (const [id] of shuffle(THEMES)) {
        if (out.length >= count) break;
        const pool = QUESTIONS.filter(q => q.t === id && !out.includes(q));
        if (pool.length) out.push(pool[Math.floor(Math.random() * pool.length)]);
      }
    }
    return out;
  }

  // ───── Navigation
  let session = null;
  function go(view, arg) { closeSheet(); window.scrollTo(0, 0); document.body.classList.toggle('tablemode', view === dealView); view(arg); }

  // Guide d'installation sur l'écran d'accueil (iPhone/iPad, hors appli déjà installée).
  function installHint() {
    const ua = navigator.userAgent;
    const iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const installed = navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if (!iOS || installed) return '';
    try { if (localStorage.getItem('raimon-hint-off')) return ''; } catch (e) { /* stockage indisponible */ }
    const notSafari = /FBAN|FBAV|Instagram|Line\/|GSA\/|Snapchat|LinkedInApp|CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua) || !/Safari\//.test(ua);
    const close = '<button class="link" data-act="hintoff">Ne plus afficher</button>';
    if (notSafari) return `<details class="card hint"><summary>Comment installer l'application ?</summary><p style="margin:8px 0 0">Ouvre d'abord cette page dans Safari :</p>
      <a class="btn primary center" style="margin:10px 0 6px;text-decoration:none" href="x-safari-${esc(location.href)}">Ouvrir dans Safari</a>
      <p class="muted" style="margin:0;font-size:14px">Si le bouton ne fait rien : touche le bouton ⋯ ou ↗ de l'application et choisis « Ouvrir dans Safari ».</p>${close}</details>`;
    return `<details class="card hint"><summary>Comment installer l'application ?</summary>
      <ol style="margin:8px 0 0;padding-left:20px">
        <li>Touche les <b>⋯</b> en bas à droite de l'écran.</li>
        <li>Touche <b>Partager</b> <span class="shareico">⬆︎</span>.</li>
        <li>Fais défiler et touche <b>« Sur l'écran d'accueil »</b> (parfois rangé dans « Plus »).</li>
        <li>Touche <b>« Ajouter »</b> : l'icône ♠♥♦♣ apparaît avec tes applis.</li></ol>
      <p class="muted" style="margin:6px 0 0;font-size:14px">Sur un iPhone plus ancien, le bouton Partager <span class="shareico">⬆︎</span> est directement en bas de l'écran : commence à l'étape 2.</p>${close}</details>`;
  }

  function home() {
    const seen = QUESTIONS.filter(q => progress[q.n]).length;
    const good = QUESTIONS.filter(mastered).length;
    const rev = toReview().length;
    const playedOk = DEALS.filter(d => (progress['d' + d.n] || {}).last === 1).length;
    void seen;
    app.innerHTML = `
      <div class="hero"><div class="logo">♠<span class="red">♥</span><span class="red">♦</span>♣</div>
        <h1>Système Raimon</h1><p>Bonjour <b>${player}</b> · <button class="link" data-act="switch" style="padding:0;font-size:15px">changer de joueur</button></p></div>
      ${installHint()}
      <div class="section-title">S'entraîner</div>
      <button class="btn primary mode" data-act="quiz"><span class="mode-ico">?</span><span>Quiz<small>${QUESTIONS.length} questions · ${good} maîtrisées${rev ? ' · ' + rev + ' à revoir' : ''}</small></span></button>
      <div class="section-title">Jouer</div>
      <button class="btn primary mode" data-act="deals"><span class="mode-ico">♠</span><span>Jouer au bridge<small>${DEALS.length} donnes · ${playedOk} réussies sans faute · enchères puis jeu de la carte</small></span></button>
      <button class="btn primary mode" data-act="duo"><span class="mode-ico">⇄</span><span>Jouer à deux<small id="duowait">Enchères au tour par tour avec Michèle, Damien ou Hélène</small></span></button>
      <div class="section-title">Consulter</div>
      <button class="btn" data-act="fiche">Fiche système<small>Toutes les conventions, par thème</small></button>
      <p class="center muted" style="font-size:13px;margin-top:20px">Un souci sur une question ou une donne ? Note son numéro et préviens Damien.</p>
      <p class="center"><button class="link" data-act="reset">Remettre la progression à zéro</button></p>
      <p class="center muted" style="font-size:13px">${versionLabel()}</p>`;
    on('quiz', () => go(quizHome));
    on('fiche', () => go(fiche));
    on('deals', () => go(dealList));
    on('duo', () => DUO.list());
    DUO.waitingCount().then(k => { const el = document.getElementById('duowait'); if (el && k) el.innerHTML = '<b>' + k + ' donne' + (k > 1 ? 's' : '') + ' t’attend' + (k > 1 ? 'ent' : '') + '</b> · enchères au tour par tour'; });
    on('hintoff', () => { try { localStorage.setItem('raimon-hint-off', '1'); } catch (e) { /* stockage indisponible */ } home(); });
    on('reset', () => { if (confirm('Effacer toute la progression de ' + player + ' sur ce téléphone ?')) { progress = {}; save(); home(); } });
    on('switch', () => go(whoAmI));
  }

  function quizHome() {
    const seen = QUESTIONS.filter(q => progress[q.n]).length;
    const good = QUESTIONS.filter(mastered).length;
    const rev = toReview().length;
    app.innerHTML = topbar('Quiz') + `
      <div class="card stats">
        <div><b>${seen}</b><span>vues</span></div>
        <div><b>${good}</b><span>maîtrisées</span></div>
        <div><b>${rev}</b><span>à revoir</span></div>
      </div>
      <button class="btn primary" data-act="themes">Par thème<small>Multi, Oklahoma, Landy, Puppet…</small></button>
      <div class="row2">
        <button class="btn" data-act="mix10">Mélange<small>10 questions</small></button>
        <button class="btn" data-act="mix20">Mélange<small>20 questions</small></button>
      </div>
      <div style="height:10px"></div>
      <button class="btn" data-act="review" ${rev ? '' : 'disabled'}>Révision des erreurs<small>${rev ? rev + ' question' + (rev > 1 ? 's' : '') + ' à revoir' : 'Rien à revoir pour l’instant'}</small></button>
      <button class="btn" data-act="find">Aller à la question n°…<small>Pour revoir une question précise</small></button>`;
    on('back', () => go(home));
    on('themes', () => go(themes));
    on('mix10', () => start(mix(10), 'Mélange'));
    on('mix20', () => start(mix(20), 'Mélange'));
    on('review', () => start(shuffle(toReview()).slice(0, 20), 'Révision'));
    on('find', () => go(find));
  }

  function on(act, fn) { app.querySelectorAll(`[data-act="${act}"]`).forEach(b => b.addEventListener('click', fn)); }
  function topbar(title, back, extra) {
    return `<header class="top"><button class="back" data-act="back">‹ ${back || 'Accueil'}</button><h1>${title}</h1>${extra || ''}</header>`;
  }
  // Bouton « 📖 Système » : la fiche s'ouvre par-dessus l'écran en cours (enchères, jeu, analyse) sans rien perdre.
  const SYS_BTN = '<button class="tobtn sys" data-sys>📖 Système</button>';
  let sheetChapter = 'precisions';
  function openSheet(chapter) {
    if (chapter) sheetChapter = chapter;
    const order = ['precisions', ...THEMES.map(t => t[0])].filter(id => FICHE[id]);
    const title = id => fmt(id === 'precisions' ? FICHE.precisions.titre : THEME_NAME[id]);
    let el = document.getElementById('sheet');
    if (!el) { el = document.createElement('div'); el.id = 'sheet'; el.className = 'sheet'; document.body.appendChild(el); document.body.style.overflow = 'hidden'; }
    el.innerHTML = `<div class="inner"><header class="top"><h1>Système Raimon</h1><button class="tobtn" data-close>✕ Fermer</button></header>
      <div class="toc">${order.map(id => `<button class="pill ${id === sheetChapter ? 'on' : ''}" data-sch="${id}">${title(id)}</button>`).join('')}</div>
      <div class="card fiche" id="schapter"><h2>${title(sheetChapter)}</h2><ul>${FICHE[sheetChapter].lignes.map(l => `<li>${suits(l)}</li>`).join('')}</ul></div>
      <a class="btn center" href="convention2026.pdf" target="_blank" rel="noopener" style="text-decoration:none">📄 Fiche originale (PDF)</a></div>`;
    el.querySelector('[data-close]').addEventListener('click', closeSheet);
    const cur = el.querySelector('.pill.on'); if (cur) cur.parentNode.scrollLeft = cur.offsetLeft - 16;
    el.querySelectorAll('[data-sch]').forEach(b => b.addEventListener('click', () => { openSheet(b.dataset.sch); document.getElementById('schapter').scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
  }
  function closeSheet() { const el = document.getElementById('sheet'); if (el) el.remove(); document.body.style.overflow = ''; }
  document.addEventListener('click', e => { if (e.target.closest('[data-sys]')) openSheet(); });

  function themes() {
    const rows = THEMES.map(([id, name]) => {
      const qs = QUESTIONS.filter(q => q.t === id);
      const m = qs.filter(mastered).length;
      return `<button class="btn" data-theme="${id}">${fmt(name)}<small>${qs.length} questions · ${m} maîtrisée${m > 1 ? 's' : ''}</small>
        <div class="bar"><i style="width:${qs.length ? Math.round(100 * m / qs.length) : 0}%"></i></div></button>`;
    }).join('');
    app.innerHTML = topbar('Par thème', 'Quiz') + rows;
    on('back', () => go(quizHome));
    app.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.theme;
      start(shuffle(QUESTIONS.filter(q => q.t === id)), THEME_NAME[id]);
    }));
  }

  function find() {
    app.innerHTML = topbar('Question n°', 'Quiz') + `
      <div class="card"><input class="num" id="num" type="number" inputmode="numeric" placeholder="Numéro de la question">
      <button class="btn primary" data-act="ok">Afficher</button><p class="muted" id="err"></p></div>`;
    on('back', () => go(quizHome));
    const input = document.getElementById('num');
    const run = () => {
      const q = BY_N.get(Number(input.value));
      if (!q) { document.getElementById('err').textContent = 'Aucune question avec ce numéro.'; return; }
      start([q], 'Question n° ' + q.n);
    };
    on('ok', run);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
    input.focus();
  }

  // Fiche : les chapitres en pastilles ; on touche une pastille pour afficher ce chapitre.
  function fiche(anchor, chapter) {
    const fromQuestion = !!(session && anchor);
    const order = ['precisions', ...THEMES.map(t => t[0])].filter(id => FICHE[id]);
    const sel = chapter || (anchor && FICHE[anchor] ? anchor : 'precisions');
    const title = id => fmt(id === 'precisions' ? FICHE.precisions.titre : THEME_NAME[id]);
    const pills = order.map(id => `<button class="pill ${id === sel ? 'on' : ''}" data-ch="${id}">${title(id)}</button>`).join('');
    app.innerHTML = topbar('Fiche système', fromQuestion ? 'Question' : 'Accueil', fromQuestion ? '<button class="tobtn" data-act="home">Accueil</button>' : '') + `
      <a class="btn center" href="convention2026.pdf" target="_blank" rel="noopener" style="text-decoration:none">📄 Voir la fiche originale (PDF)</a>
      <div class="toc">${pills}</div>
      <div class="card fiche" id="chapter"><h2>${title(sel)}</h2>
        <ul>${FICHE[sel].lignes.map(l => `<li>${suits(l)}</li>`).join('')}</ul></div>
      ${fromQuestion ? '<div style="height:70px"></div><button class="btn primary center" data-act="back" style="position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:auto;max-width:528px;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,.2)">‹ Retour à la question</button>' : ''}`;
    on('back', () => fromQuestion ? go(question) : go(home));
    on('home', () => { session = null; go(home); });
    app.querySelectorAll('[data-ch]').forEach(b => b.addEventListener('click', () => {
      fiche(anchor, b.dataset.ch);
      document.getElementById('chapter').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
    if (chapter === undefined && anchor) document.getElementById('chapter').scrollIntoView({ block: 'start' });
  }

  // ───── Session de quiz
  function start(list, title) {
    session = { list, title, i: 0, score: 0, missed: [], answered: false, choice: null, options: null };
    go(question);
  }

  function optionsFor(q) {
    let wrong = q.w;
    if (!wrong) {
      const pool = [...new Set(QUESTIONS.filter(o => o.t === q.t && o.k === 's' && o.a !== q.a).map(o => o.a))];
      wrong = shuffle(pool).slice(0, 3);
    }
    return shuffle([q.a, ...wrong.slice(0, 3)]);
  }

  function auctionHtml(q) {
    const list = bids(q);
    const cells = [];
    const start = SEATS.indexOf(q.d);
    for (let i = 0; i < start; i++) cells.push('<td></td>');
    list.forEach((b, i) => {
      const hl = q.k === 's' && i === list.length - 1;
      cells.push(`<td class="${hl ? 'hl' : ''}"><span>${fmt(bidLabel(b))}</span></td>`);
    });
    if (q.k === 'm') cells.push('<td class="ask">?</td>');
    if (!list.length && q.k === 's') return '';
    while (cells.length % 4) cells.push('<td></td>');
    let rows = '';
    for (let i = 0; i < cells.length; i += 4) rows += '<tr>' + cells.slice(i, i + 4).join('') + '</tr>';
    const head = SEATS.map(s => `<th class="${s === 'S' ? 'me' : ''}">${s === 'S' ? 'Toi' : s === 'N' ? 'Partenaire' : SEAT_NAMES[s]}</th>`).join('');
    return `<table class="auction"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }

  function handHtml(h) {
    const parts = h.split('.');
    const syms = ['♠', '♥', '♦', '♣'];
    let hcp = 0;
    const lines = parts.map((p, i) => {
      const cards = p === '-' ? [] : p.split('');
      cards.forEach(c => { hcp += { A: 4, K: 3, Q: 2, J: 1 }[c] || 0; });
      const txt = cards.length ? cards.map(c => ({ A: 'A', K: 'R', Q: 'D', J: 'V', T: '10' }[c] || c)).join(' ') : '—';
      return `<div><span class="s ${i === 1 || i === 2 ? 'red' : ''}">${syms[i]}</span>${txt}</div>`;
    });
    return `<div class="hand">${lines.join('')}<div class="meta">${hcp}H · ${parts.map(p => p === '-' ? 0 : p.length).join('-')}</div></div>`;
  }

  function promptFor(q) {
    if (q.q) return q.q;
    if (q.k === 'm') return 'Ta main. Que dis-tu ?';
    const list = bids(q);
    const b = list[list.length - 1];
    const who = bidderOf(q);
    if (b === 'P') return who === 'S' ? 'Que montres-tu en passant ?' : 'Que montre ton partenaire en passant ?';
    const lab = fmt(bidLabel(b));
    if (who === 'S') return `Que montres-tu avec ${lab} ?`;
    if (who === 'N') return `Que montre ton partenaire avec ${lab} ?`;
    return `Que montre ${SEAT_NAMES[who]} avec ${lab} ?`;
  }

  function question() {
    const s = session, q = s.list[s.i];
    if (!s.options && q.k !== 'm') s.options = optionsFor(q);
    let body = '';
    if (q.k === 's' || q.k === 'm') body += auctionHtml(q);
    if (q.k === 'm') body += handHtml(q.h);
    body += `<div class="prompt">${q.q ? fmt(q.q) : promptFor(q)}</div>`;
    if (q.k === 'm') body += boxHtml(q);
    else body += s.options.map((o, i) => `<button class="opt" data-opt="${i}">${fmt(o)}</button>`).join('');
    body += `<div id="fb"></div>`;
    app.innerHTML = topbar(fmt(s.title), 'Quitter') + `
      <div class="card">
        <div class="qhead"><span class="qnum">Question n° ${q.n}</span></div>
        ${s.list.length > 1 ? `<div class="progress">${s.i + 1} / ${s.list.length} · score ${s.score}</div>` : ''}
        ${body}
      </div>`;
    on('back', () => { session = null; go(quizHome); });
    if (q.k === 'm') wireBox(lastContractRank(bids(q)), s, answer);
    else app.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => answer(s.options[+b.dataset.opt])));
    if (s.answered) showFeedback();
  }

  // ───── Boîte d'enchères
  function lastContractRank(list) { return Math.max(-1, ...list.map(bidRank)); }
  function boxHtml() {
    return `<div class="box">
      <div class="levels">${[1, 2, 3, 4, 5, 6, 7].map(l => `<button class="bb" data-level="${l}">${l}</button>`).join('')}</div>
      <div class="strains">${STRAINS.map(st => `<button class="bb" data-strain="${st}">${suits(st)}</button>`).join('')}</div>
      <div class="specials"><button class="bb pass" data-bid="P">Passe</button><button class="bb dbl" data-bid="X">X</button><button class="bb rdbl" data-bid="XX">XX</button></div>
      <div class="chosen" id="chosen">Choisis un palier puis une couleur</div>
      <button class="btn primary center" id="validate" disabled>Valider</button></div>`;
  }
  // s : état partagé { choice, answered } ; onValidate(choix) appelé à la validation.
  function wireBox(min, s, onValidate) {
    let level = null;
    const levelBtns = app.querySelectorAll('[data-level]'), strainBtns = app.querySelectorAll('[data-strain]');
    const validate = document.getElementById('validate'), chosen = document.getElementById('chosen');
    levelBtns.forEach(b => { if (bidRank(b.dataset.level + 'SA') <= min) b.disabled = true; });
    const refresh = () => {
      levelBtns.forEach(b => b.classList.toggle('sel', +b.dataset.level === level));
      strainBtns.forEach(b => {
        b.disabled = level === null || bidRank(level + b.dataset.strain) <= min;
        b.classList.toggle('sel', s.choice === level + b.dataset.strain);
      });
      app.querySelectorAll('[data-bid]').forEach(b => b.classList.toggle('sel', s.choice === b.dataset.bid));
      chosen.innerHTML = s.choice ? `Ton enchère : <b>${fmt(bidLabel(s.choice))}</b>` : 'Choisis un palier puis une couleur';
      validate.disabled = !s.choice || s.answered;
    };
    levelBtns.forEach(b => b.addEventListener('click', () => { if (s.answered) return; level = +b.dataset.level; s.choice = null; refresh(); }));
    strainBtns.forEach(b => b.addEventListener('click', () => { if (s.answered) return; s.choice = level + b.dataset.strain; refresh(); }));
    app.querySelectorAll('[data-bid]').forEach(b => b.addEventListener('click', () => { if (s.answered) return; level = null; s.choice = b.dataset.bid; refresh(); }));
    validate.addEventListener('click', () => onValidate(s.choice));
    if (s.answered) { app.querySelectorAll('.bb').forEach(b => { b.disabled = true; }); validate.style.display = 'none'; }
    refresh();
  }

  function answer(choice) {
    const s = session, q = s.list[s.i];
    if (s.answered) return;
    s.answered = true; s.choice = choice;
    s.ok = choice === q.a || (q.alt || []).includes(choice);
    if (s.ok) s.score++; else s.missed.push(q.n);
    record(q.n, s.ok);
    question();
  }

  function showFeedback() {
    const s = session, q = s.list[s.i];
    if (q.k !== 'm') {
      app.querySelectorAll('[data-opt]').forEach(b => {
        const o = s.options[+b.dataset.opt];
        b.disabled = true;
        if (o === q.a) b.classList.add('good'); else if (o === s.choice) b.classList.add('bad');
      });
    }
    const last = s.i === s.list.length - 1;
    const fb = document.getElementById('fb');
    fb.innerHTML = `<div class="feedback ${s.ok ? 'ok' : 'ko'}">
        <h3>${s.ok ? 'Bravo !' : 'Raté'} <span class="qtheme">· ${fmt(THEME_NAME[q.t])}</span></h3>
        ${!s.ok && q.k === 'm' ? `<p>La bonne enchère : <b>${fmt(bidLabel(q.a))}</b></p>` : ''}
        ${q.e ? `<p>${fmt(q.e)}</p>` : ''}
        ${q.f ? `<div class="fiche-line">Fiche : ${fmt(q.f)}</div>` : ''}
        <button class="link" data-act="seefiche">Voir ce thème dans la fiche</button>
        <div id="fix" style="margin-top:8px">${DUO.fixButtonHtml()}</div>
      </div>
      <div style="height:12px"></div>
      <button class="btn primary center" data-act="next">${last ? 'Voir le résultat' : 'Question suivante'}</button>`;
    on('seefiche', () => go(fiche, q.t));
    DUO.wireFix({ type: 'question', question: q.n, rapport: 'Question n° ' + q.n + ' (' + THEME_NAME[q.t] + ') — réponse attendue : ' + bidLabel(q.a) + (s.ok ? '' : ' — réponse donnée : ' + bidLabel(s.choice)) });
    on('next', next);
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function next() {
    const s = session;
    if (s.i < s.list.length - 1) {
      s.i++; s.answered = false; s.choice = null; s.options = null; go(question);
    } else go(results);
  }

  function results() {
    const s = session;
    const pct = Math.round(100 * s.score / s.list.length);
    app.innerHTML = topbar(fmt(s.title)) + `
      <div class="card center"><div style="font-size:44px;font-weight:700">${s.score} / ${s.list.length}</div>
        <div class="muted">${pct >= 90 ? 'Excellent !' : pct >= 70 ? 'Très bien' : pct >= 50 ? 'Pas mal, on révise ?' : 'À retravailler'}</div></div>
      ${s.missed.length ? `<div class="card"><b>Questions ratées</b><div class="missed" style="margin-top:8px">${s.missed.map(n => `<span>n° ${n}</span>`).join('')}</div>
        <p class="muted" style="font-size:14px">Elles reviendront dans « Révision des erreurs ».</p></div>` : ''}
      <button class="btn primary center" data-act="again">Rejouer ces questions</button>
      <button class="btn center" data-act="back2">Retour au quiz</button>`;
    on('back', () => { session = null; go(quizHome); });
    on('back2', () => { session = null; go(quizHome); });
    on('again', () => start(shuffle(s.list), s.title));
  }

  // ───── Donnes à enchérir (Sud = toi, Nord = partenaire robot qui suit le système)
  const seatAt = (deal, i) => SEATS[(SEATS.indexOf(deal.d) + i) % 4];
  const dealKey = n => 'd' + n;
  const sideOf = s => (s === 'N' || s === 'S' ? 'NS' : 'EO');

  function contractOf(deal) {
    let last = null, lastSeat = null, dbl = '';
    deal.a.forEach(([b], i) => {
      if (b === 'P') return;
      if (b === 'X') { dbl = ' contré'; return; }
      if (b === 'XX') { dbl = ' surcontré'; return; }
      last = b; lastSeat = seatAt(deal, i); dbl = '';
    });
    if (!last) return 'Donne passée';
    const strain = last.replace(/^[1-7]/, '');
    const k = deal.a.findIndex(([b], j) => bidRank(b) >= 0 && b.replace(/^[1-7]/, '') === strain && sideOf(seatAt(deal, j)) === sideOf(lastSeat));
    const decl = seatAt(deal, k);
    return `${last}${dbl} joué par ${decl === 'S' ? 'toi' : decl === 'N' ? 'ton partenaire' : SEAT_NAMES[decl]}`;
  }

  function pickDeal(except) {
    const todo = DEALS.filter(d => !progress[dealKey(d.n)] && d !== except);
    const redo = DEALS.filter(d => (progress[dealKey(d.n)] || {}).last === 0 && d !== except);
    const pool = todo.length ? todo : redo.length ? redo : DEALS.filter(d => d !== except);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function dealList() {
    const played = DEALS.filter(d => progress[dealKey(d.n)]);
    const perfect = DEALS.filter(d => (progress[dealKey(d.n)] || {}).last === 1);
    app.innerHTML = topbar('Jouer au bridge', null, SYS_BTN) + `
      <div class="card"><p style="margin:0 0 6px">Tu es <b>Sud</b>, ton partenaire robot est <b>Nord</b> : il connaît le système par cœur.
        Annonce tes enchères (une erreur est corrigée tout de suite), puis joue le contrat contre la défense robot.</p>
        <p class="muted" style="margin:0;font-size:14px">${played.length} / ${DEALS.length} jouées · ${perfect.length} réussies sans faute</p></div>
      <button class="btn primary center" data-act="next">Donne suivante</button>
      <div class="row2" style="margin-bottom:10px"><input class="num" id="dealnum" type="number" inputmode="numeric" placeholder="Donne n°" style="margin:0"><button class="btn center" data-act="godeal" style="margin:0">Jouer cette donne</button></div>
      <p class="muted" id="dealerr" style="margin:0 0 8px"></p>
      ${[['Toutes les donnes', DEALS.slice().sort((a, b) => a.n - b.n)]].map(([title, list]) => `
      <div class="section-title">${title}</div>
      <div class="dgrid">${list.map(d => {
        const p = progress[dealKey(d.n)];
        const cls = !p ? '' : p.last === 1 ? 'good' : 'bad';
        return `<button class="dcell ${cls}" data-deal="${d.n}">${d.n}</button>`;
      }).join('')}</div>`).join('')}
      <p class="muted center" style="font-size:13px">Vert : réussie sans faute · rouge : à rejouer</p>`;
    on('back', () => go(home));
    on('next', () => startDeal(pickDeal()));
    on('godeal', () => {
      const d = DEALS.find(x => x.n === +document.getElementById('dealnum').value);
      if (d) startDeal(d); else document.getElementById('dealerr').textContent = 'Aucune donne avec ce numéro.';
    });
    app.querySelectorAll('[data-deal]').forEach(b => b.addEventListener('click', () => startDeal(DEALS.find(d => d.n === +b.dataset.deal))));
  }

  let play = null;
  const DUO = createDuo({ app, topbar, SYS_BTN, on, go, fmt, bidLabel, bidRank, getPlayer: () => player, players: PLAYERS, home, SEAT_NAMES });
  const PLAY = createPlay({ app, fmt, topbar, on, go: v => v(), getProgress: () => progress, save, exit: () => go(dealList) });
  const biddingDone = n => { const p = progress[dealKey(n)]; return !!p && (p.won || p.last === 1); };
  function startDeal(deal, skipIntro) {
    play = { deal, i: 0, errors: [], subs: {}, choice: null, answered: false };
    if (!skipIntro && biddingDone(deal.n) && deal.dd !== undefined) return go(dealIntro);
    go(dealView);
  }
  function dealIntro() {
    const deal = play.deal;
    app.innerHTML = topbar('Donne n° ' + deal.n, 'Donnes', SYS_BTN) + `
      <div class="card center"><div style="font-size:18px;font-weight:700">Tu as déjà réussi les enchères de cette donne.</div>
        <p class="muted" style="margin:6px 0 0">Contrat : <b>${fmt(deal.c.l + deal.c.s)}</b> joué par ${deal.c.by === 'S' ? 'toi' : 'ton partenaire'}</p></div>
      <button class="btn primary center" data-act="cardsnow">Jouer la carte directement</button>
      <button class="btn center" data-act="bidagain">Refaire les enchères</button>`;
    on('back', () => { play = null; go(dealList); });
    on('cardsnow', () => { window.scrollTo(0, 0); PLAY.start(deal); });
    on('bidagain', () => startDeal(deal, true));
  }

  // Enchères posées sur le tapis devant chaque joueur (Nord en haut, Sud = toi en bas)
  function bidCard(b, cls) {
    const kind = b === 'P' ? 'pass' : b === 'X' ? 'dbl' : b === 'XX' ? 'rdbl' : '';
    return `<span class="bidcard ${kind} ${cls || ''}">${b === 'P' ? 'Passe' : fmt(b)}</span>`;
  }
  function bidTableHtml(deal, upto, ask) {
    const by = { N: [], E: [], S: [], O: [] };
    for (let k = 0; k < upto; k++) by[seatAt(deal, k)].push(bidCard(play.subs[k] || deal.a[k][0], (k === upto - 1 ? 'last ' : '') + (play.errors.some(e => e.i === k) ? 'wasbad' : '')));
    if (ask) by.S.push('<span class="bidcard ask">?</span>');
    const turnSeat = ask ? 'S' : null;
    const zone = (seat, cls, name) => `<div class="bzone ${cls} ${turnSeat === seat ? 'turn' : ''}"><div class="sname">${name}${deal.d === seat ? ' · donneur' : ''}</div><div class="bids">${by[seat].join('')}</div></div>`;
    const vul = { none: 'Personne vulnérable', NS: 'Vous êtes vulnérables', EO: 'Eux vulnérables', all: 'Tous vulnérables' }[deal.v || 'none'];
    return `<div class="felt bidding">${zone('N', 'top', 'Partenaire')}${zone('O', 'left', 'Ouest')}<div class="bcenter">${vul}</div>${zone('E', 'right', 'Est')}${zone('S', 'bottom', 'Toi')}</div>`;
  }
  // Ta main en éventail (enchères)
  function fanStr(h) {
    const parts = h.split('.').map(p => (p === '-' ? '' : p));
    const lab = c => ({ A: 'A', K: 'R', Q: 'D', J: 'V', T: '10' }[c] || c);
    return `<div class="fan">${[0, 1, 3, 2].flatMap(s => parts[s].split('').filter(Boolean).map(c => cardHtml(s, lab(c)))).join('')}</div>`;
  }

  function dealAuctionHtml(deal, upto, ask) {
    const cells = [];
    for (let k = 0; k < SEATS.indexOf(deal.d); k++) cells.push('<td></td>');
    for (let k = 0; k < upto; k++) {
      const err = play.errors.find(e => e.i === k);
      cells.push(`<td class="${err ? 'wasbad' : ''}"><span>${fmt(bidLabel(play.subs[k] || deal.a[k][0]))}</span></td>`);
    }
    if (ask) cells.push('<td class="ask">?</td>');
    while (cells.length % 4) cells.push('<td></td>');
    let rows = '';
    for (let k = 0; k < cells.length; k += 4) rows += '<tr>' + cells.slice(k, k + 4).join('') + '</tr>';
    const head = SEATS.map(s => `<th class="${s === 'S' ? 'me' : ''}">${s === 'S' ? 'Toi' : s === 'N' ? 'Partenaire' : SEAT_NAMES[s]}</th>`).join('');
    return `<table class="auction"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }

  function dealView() {
    const p = play, deal = p.deal;
    // Les autres joueurs annoncent jusqu'à ce que ce soit à toi.
    while (!p.answered && p.i < deal.a.length && seatAt(deal, p.i) !== 'S') p.i++;
    if (!p.answered && p.i >= deal.a.length) return go(dealEnd);
    const myTurn = !p.answered;
    document.body.classList.add('tablemode');
    const upto = p.answered ? p.i + 1 : p.i;
    // Comme Funbridge : toutes les enchères de chaque joueur, alignées hors du cadre près de sa place,
    // avec un carton STOP automatique devant chaque enchère à saut.
    const stacks = { N: [], E: [], S: [], O: [] };
    let lastRank = -1;
    const cols = ['SA', '♠', '♥', '♦', '♣'];
    for (let k = 0; k < upto; k++) {
      const b = p.subs[k] || deal.a[k][0], seat = seatAt(deal, k), rk = bidRank(b);
      if (rk >= 0) {
        const strain = b.slice(1);
        let minLevel = 1; while (bidRank(minLevel + strain) <= lastRank) minLevel++;
        if (+b[0] > minLevel) stacks[seat].push('<div class="gb stack stop">STOP</div>');
        lastRank = rk;
      }
      const kind = b === 'P' ? 'gpass' : b === 'X' ? 'gx' : b === 'XX' ? 'gxx' : 'g' + cols.indexOf(b.slice(1));
      const txt = b === 'P' ? 'PASSE' : b === 'X' || b === 'XX' ? b : b[0] + `<span>${b.slice(1) === 'SA' ? 'SA' : suits(b.slice(1))}</span>`;
      stacks[seat].push(`<div class="gb stack ${kind} ${k === upto - 1 ? 'last' : ''} ${p.errors.some(e => e.i === k) ? 'wasbad' : ''}">${txt}</div>`);
    }
    const tile = seat => (stacks[seat].length ? `<div class="bidstack ${seat}">${stacks[seat].join('')}</div>` : '');
    const history = '';
    const vul = { none: 'Personne vulnérable', NS: 'Vulnérables : N/S', EO: 'Vulnérables : E/O', all: 'Tous vulnérables' }[deal.v || 'none'];
    const plate = (seat, cls, name) => `<div class="plate ${cls} ${myTurn && seat === 'S' ? 'turn' : ''}"><span class="seat">${seat}</span>${name}${deal.d === seat ? ' · donneur' : ''}</div>`;
    app.innerHTML = topbar('Donne n° ' + deal.n, 'Quitter', SYS_BTN) + `
      <div class="frame bidframe">
        ${plate('N', 'top', 'Partenaire')}${plate('O', 'left', 'Ouest')}${plate('E', 'right', 'Est')}${plate('S', 'bottom', 'Toi')}
        ${tile('N')}${tile('E')}${tile('O')}${tile('S')}
        <div class="bidcenter" id="fb">${myTurn ? gridBoxHtml(deal, p) : ''}</div>
        <div class="vulnote">${vul}</div>
      </div>

      ${arcHtml([0, 1, 3, 2].flatMap(s => deal.h.S.split('.')[s].replace('-', '').split('').filter(Boolean).map(ch => ({ s, label: ({ A: 'A', K: 'R', Q: 'D', J: 'V', T: '10' }[ch] || ch) }))))}`;
    on('back', () => { if (confirm('Abandonner cette donne ?')) { play = null; go(dealList); } });
    if (myTurn) wireGridBox(deal, p);
    else dealFeedback();
  }

  // Boîte d'enchères complète (7 paliers × 5 dénominations) : on touche une enchère, puis « Annoncer ».
  function auctionState(deal, upto) {
    let last = -1, lastSeat = null, dbl = 0;
    for (let k = 0; k < upto; k++) {
      const b = deal.a[k][0], seat = seatAt(deal, k);
      if (b === 'P') continue;
      if (b === 'X') { dbl = 1; continue; }
      if (b === 'XX') { dbl = 2; continue; }
      last = bidRank(b); lastSeat = seat; dbl = 0;
    }
    const opp = lastSeat === 'E' || lastSeat === 'O';
    return { last, canX: opp && dbl === 0, canXX: !opp && lastSeat !== null && dbl === 1 };
  }
  function gridBoxHtml(deal, p) {
    const st = auctionState(deal, p.i);
    const cols = ['SA', '♠', '♥', '♦', '♣'];
    let rows = '';
    for (let l = 1; l <= 7; l++) rows += cols.map(c => { const b = l + c; const ok = bidRank(b) > st.last; return `<button class="gb g${cols.indexOf(c)} ${p.choice === b ? 'sel' : ''}" ${ok ? `data-gb="${b}"` : 'disabled'}>${l}<span>${c === 'SA' ? 'SA' : suits(c)}</span></button>`; }).join('');
    // 1er toucher : l'enchère grossit au milieu ; 2e toucher (sur elle, ou sur la même case) : on l'annonce.
    const big = p.choice ? (() => {
      const k = p.choice === 'P' ? 'gpass' : p.choice === 'X' ? 'gx' : p.choice === 'XX' ? 'gxx' : 'g' + cols.indexOf(p.choice.slice(1));
      const txt = p.choice === 'P' ? 'PASSE' : p.choice.length > 2 && p.choice !== 'XX' ? p.choice[0] + '<span>SA</span>' : p.choice === 'X' || p.choice === 'XX' ? p.choice : p.choice[0] + `<span>${suits(p.choice.slice(1))}</span>`;
      return `<div class="bigbid-veil" data-act="unpick"></div><button class="gb bigbid ${k}" data-act="announce">${txt}<small>Touche pour annoncer</small></button>`;
    })() : '';
    return `<div class="gridwrap"><div class="gridbox">${rows}</div>
      <div class="gspecial"><button class="gb gpass ${p.choice === 'P' ? 'sel' : ''}" data-gb="P">PASSE</button><button class="gb gx ${p.choice === 'X' ? 'sel' : ''}" ${st.canX ? 'data-gb="X"' : 'disabled'}>X</button><button class="gb gxx ${p.choice === 'XX' ? 'sel' : ''}" ${st.canXX ? 'data-gb="XX"' : 'disabled'}>XX</button></div>
      ${big}</div>
      <p class="gridhint">${p.choice ? 'Touche l’enchère au centre pour l’annoncer' : 'À toi : touche ton enchère'}</p>`;
  }
  function wireGridBox(deal, p) {
    const redraw = () => { document.getElementById('fb').innerHTML = gridBoxHtml(deal, p); wireGridBox(deal, p); };
    app.querySelectorAll('[data-gb]').forEach(b => b.addEventListener('click', () => {
      if (p.choice === b.dataset.gb) return dealAnswer(p.choice);
      p.choice = b.dataset.gb; redraw();
    }));
    on('announce', () => dealAnswer(p.choice));
    on('unpick', () => { p.choice = null; redraw(); });
  }

  function dealAnswer(choice) {
    const p = play;
    p.answered = true; p.choice = choice;
    p.ok = choice === p.deal.a[p.i][0] || (p.deal.a[p.i][2] || []).includes(choice);
    if (p.ok && choice !== p.deal.a[p.i][0]) p.subs[p.i] = choice;
    if (!p.ok) p.errors.push({ i: p.i, chosen: choice });
    dealView();
  }

  function dealFeedback() {
    const p = play, [good, why] = p.deal.a[p.i];
    document.getElementById('fb').innerHTML = `<div class="feedback ${p.ok ? 'ok' : 'ko'}">
        <h3>${p.ok ? 'Bien joué : ' + fmt(bidLabel(p.choice)) : 'Non : il fallait ' + fmt(bidLabel(good))}</h3>
        ${!p.ok ? `<p class="muted">Tu avais dit ${fmt(bidLabel(p.choice))}. On continue avec la bonne enchère.</p>` : ''}
        ${why ? `<p>${fmt(why)}</p>` : ''}
      </div>
      <button class="btn primary center" data-act="cont" style="margin-top:10px">Continuer</button>`;
    on('cont', () => { p.i++; p.answered = false; p.choice = null; go(dealView); });
  }

  function miniHand(h, who) {
    const syms = ['♠', '♥', '♦', '♣'];
    const parts = h.split('.');
    const hcp = parts.join('').split('').reduce((s, c) => s + ({ A: 4, K: 3, Q: 2, J: 1 }[c] || 0), 0);
    return `<div class="mini"><div class="who">${who} · ${hcp}H</div>${parts.map((p, i) =>
      `<div><span class="${i === 1 || i === 2 ? 'red' : ''}">${syms[i]}</span> ${p === '-' ? '—' : p.split('').map(c => ({ A: 'A', K: 'R', Q: 'D', J: 'V', T: '10' }[c] || c)).join(' ')}</div>`).join('')}</div>`;
  }

  function dealEnd() {
    const p = play, deal = p.deal;
    const perfect = p.errors.length === 0;
    const prev = progress[dealKey(deal.n)] || {};
    progress[dealKey(deal.n)] = { plays: (prev.plays || 0) + 1, last: perfect ? 1 : 0, won: !!(prev.won || prev.last === 1 || perfect) };
    save();
    const mine = deal.a.filter((x, k) => seatAt(deal, k) === 'S').length;
    const nErr = p.errors.length;
    app.innerHTML = topbar('Donne n° ' + deal.n, 'Donnes', SYS_BTN) + `
      <div class="card center">
        <div style="font-size:15px" class="muted">Contrat final</div>
        <div style="font-size:24px;font-weight:700;margin:4px 0">${fmt(contractOf(deal))}</div>
        <div class="feedback ${perfect ? 'ok' : 'ko'}" style="margin-top:10px">
          <h3 style="margin:0">${perfect ? 'Parfait : bon contrat, sans faute !' : `Retoqué : ${nErr} enchère${nErr > 1 ? 's' : ''} fausse${nErr > 1 ? 's' : ''} sur ${mine}`}</h3>
          ${perfect ? '' : '<p style="margin:6px 0 0">Sans les corrections, vous ne seriez pas arrivés à ce contrat. Rejoue-la plus tard !</p>'}
        </div>
        <p class="muted" style="font-size:14px;margin:10px 0 0">Thème : ${fmt(deal.t)}</p>
      </div>
      <details class="card"><summary><b>Voir les 4 mains</b> <span class="muted" style="font-size:13px">(dévoile le jeu)</span></summary>
        <div class="compass">
          <div class="cN">${miniHand(deal.h.N, 'Partenaire')}</div>
          <div class="cO">${miniHand(deal.h.O, 'Ouest')}</div>
          <div class="cE">${miniHand(deal.h.E, 'Est')}</div>
          <div class="cS">${miniHand(deal.h.S, 'Toi')}</div>
        </div></details>
      <div class="card"><b>Les enchères expliquées</b>
        <ol class="expl">${deal.a.map(([b, why], k) => {
          const seat = seatAt(deal, k);
          const err = p.errors.find(e => e.i === k);
          if (b === 'P' && !why && seat !== 'S') return '';
          return `<li class="${err ? 'bad' : ''}"><b>${seat === 'S' ? 'Toi' : seat === 'N' ? 'Partenaire' : SEAT_NAMES[seat]} : ${fmt(bidLabel(p.subs[k] || b))}</b>${why ? ' — ' + fmt(why) : ''}${err ? `<br><span class="muted">tu avais dit ${fmt(bidLabel(err.chosen))}</span>` : ''}</li>`;
        }).join('')}</ol></div>
      ${deal.dd !== undefined ? '<button class="btn primary center" data-act="playcards">Jouer le contrat</button>' : ''}
      <button class="btn ${deal.dd !== undefined ? '' : 'primary'} center" data-act="nextdeal">Donne suivante</button>
      <button class="btn center" data-act="again">Rejouer les enchères</button>
      <div id="fix">${DUO.fixButtonHtml()}</div>`;
    on('playcards', () => { window.scrollTo(0, 0); PLAY.start(deal); });
    on('back', () => { play = null; go(dealList); });
    on('again', () => startDeal(deal, true));
    DUO.wireFix({ type: 'donne', donne: deal.n, rapport: 'Donne n° ' + deal.n + ' (' + deal.t + ') — séquence du système : ' + deal.a.map(x => bidLabel(x[0])).join(' – ') + (p.errors.length ? ' — erreurs : ' + p.errors.map(e => 'enchère ' + (e.i + 1) + ' : ' + bidLabel(e.chosen) + ' au lieu de ' + bidLabel(deal.a[e.i][0])).join(' ; ') : '') });
    on('nextdeal', () => startDeal(pickDeal(deal)));
  }

  // ───── Mise à jour : si une nouvelle version est publiée, on propose de recharger (utile dans l'appli installée,
  // qui n'a pas de bouton ↻).
  const myVersion = ((document.querySelector('script[src*="jeu.js"]') || {}).src || '').split('v=')[1] || '';
  // « Version du 12/10/2026 à 17h31 » : pour vérifier d'un coup d'œil que le téléphone est à jour.
  function versionLabel() {
    const v = myVersion;
    if (!/^\d{12}$/.test(v)) return 'Version de développement';
    return `Version du ${v.slice(6, 8)}/${v.slice(4, 6)}/${v.slice(0, 4)} à ${v.slice(8, 10)}h${v.slice(10, 12)}`;
  }
  function checkUpdate() {
    if (!myVersion || !window.fetch) return;
    fetch('./?maj=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(html => {
      const m = html.match(/jeu\.js\?v=(\d+)/);
      if (!m || m[1] === myVersion || document.getElementById('majbar')) return;
      const bar = document.createElement('div');
      bar.id = 'majbar';
      bar.innerHTML = '<span>Nouvelle version disponible</span><button>Mettre à jour</button>';
      bar.querySelector('button').addEventListener('click', () => location.reload());
      document.body.appendChild(bar);
    }).catch(() => { /* hors ligne */ });
  }
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

  if (player) { loadProgress(); home(); } else whoAmI();
})();
</script>
</body>
</html>
